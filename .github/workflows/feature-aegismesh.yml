name: Update Portfolio Experience
on:
  push:
    paths:
      - '.github/workflows/feature-aegismesh.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSME Idea Hackathon experience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''<section id="experience"><h2>Experience & Achievements</h2><div class="card"><h3>FlyRank AI — AI Intern</h3><p>July 2026 – Present • Bosnia and Herzegovina</p><p>Specialization: General AI Fluency & Backend AI Engineering</p><p>AI-related implementation, experimentation and documentation using Python and NLP concepts.</p></div><div class="card"><h3>IBM — Summer Intern</h3><p>May 2022 – June 2022 • New Delhi</p></div><div class="card"><h3>Start-Up Pitch Competition — Certificate of Participation</h3><p>Usha Martin University Ranchi • Aug 2026</p></div></section>'''
          new = '''<section id="experience"><h2>Experience & Achievements</h2><div class="card"><h3>FlyRank AI — AI Intern</h3><p>July 2026 – Present • Bosnia and Herzegovina</p><p>Specialization: General AI Fluency & Backend AI Engineering</p><p>AI-related implementation, experimentation and documentation using Python and NLP concepts.</p></div><div class="card"><h3>MSME Idea Hackathon 6.0 — Shortlisted Project Pitch</h3><p>Team RapiFy • Jharkhand Tool Room, Ranchi</p><p>Shortlisted to present <strong>VoiceOps AI</strong>, an AI-powered voice assistant designed to address missed calls, booking conflicts, limited support availability and communication inefficiencies for businesses and service providers.</p><p>Contributed to developing and presenting the project concept, explaining its real-world applications, technical workflow and potential impact to evaluators. The experience strengthened practical problem-solving, project pitching, teamwork and AI-based solution design across healthcare, education, hospitality and corporate use cases.</p></div><div class="card"><h3>IBM — Summer Intern</h3><p>May 2022 – June 2022 • New Delhi</p></div><div class="card"><h3>Start-Up Pitch Competition — Certificate of Participation</h3><p>Usha Martin University Ranchi • Aug 2026</p></div></section>'''
          if old not in s:
              raise SystemExit('Experience section not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add MSME Idea Hackathon experience" || exit 0
          git push
