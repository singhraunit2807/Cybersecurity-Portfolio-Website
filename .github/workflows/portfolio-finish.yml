name: Portfolio finishing build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow

      - name: Apply final portfolio finishing touches
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<meta name="description" content="Raunit Singh — AI, Backend Systems & Cybersecurity Portfolio">'
          og = '''<meta name="theme-color" content="#0B0F17"><meta property="og:type" content="website"><meta property="og:title" content="Raunit Singh | AI & Cybersecurity Portfolio"><meta property="og:description" content="Raunit Singh — Backend AI Engineer & Systems Developer building practical AI, systems and cybersecurity projects."><meta property="og:url" content="https://singhraunit2807.github.io/Cybersecurity-Portfolio-Website/"><meta property="og:image" content="https://singhraunit2807.github.io/Cybersecurity-Portfolio-Website/og-preview.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Raunit Singh | AI & Cybersecurity Portfolio"><meta name="twitter:description" content="Backend AI, systems and cybersecurity portfolio."><meta name="twitter:image" content="https://singhraunit2807.github.io/Cybersecurity-Portfolio-Website/og-preview.png">'''
          if 'property="og:title"' not in s and marker in s:
              s = s.replace(marker, marker + og, 1)

          old_nav = '<nav><div style="max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap"><a href="#about" style="font-weight:800;color:var(--text)">Raunit Singh</a><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>'
          new_nav = '<nav><div class="nav-inner"><a href="#about" class="nav-brand">Raunit Singh</a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button><div id="nav-links" class="nav-links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a><a href="Raunit_Singh_Resume.pdf" download class="nav-resume">Resume PDF</a></div></div></nav>'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          mobile_css = '''nav{padding:12px 5%}.nav-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.nav-brand{font-weight:800;color:var(--text);text-decoration:none}.nav-links{display:flex;align-items:center;gap:18px}.nav-links a{margin:0}.nav-resume{border:1px solid var(--a);padding:7px 11px;border-radius:7px;color:var(--a)!important;font-weight:800}.nav-toggle{display:none;background:#0d1727;border:1px solid var(--b);color:var(--text);border-radius:7px;padding:7px 10px;font:inherit;font-size:14px}.card,.detail,.cert{min-width:0;overflow-wrap:anywhere}.flow span{max-width:100%;overflow-wrap:anywhere}@media(max-width:700px){.nav-toggle{display:block}.nav-links{display:none;width:100%;flex-direction:column;align-items:stretch;gap:4px;padding:10px 0}.nav-links.open{display:flex}.nav-links a{padding:7px 0}.nav-inner{flex-wrap:wrap}.nav-brand{margin-right:auto}.nav-resume{text-align:center}.card{padding:20px}.profile-frame{width:min(300px,100%)}.flow span{width:100%}}'''
          if '.nav-inner{' not in s:
              s = s.replace('</style>', mobile_css + '</style>', 1)

          hero_marker = '<a class="btn" href="#contact" style="background:transparent;color:var(--a)">Contact</a>'
          if 'Raunit_Singh_Resume.pdf' not in s and hero_marker in s:
              s = s.replace(hero_marker, hero_marker + ' <a class="btn" href="Raunit_Singh_Resume.pdf" download>Resume PDF</a>', 1)

          script = '''<script>(function(){const b=document.querySelector('.nav-toggle'),m=document.querySelector('#nav-links');if(b&&m){b.addEventListener('click',function(){const o=m.classList.toggle('open');b.setAttribute('aria-expanded',String(o));});m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){m.classList.remove('open');b.setAttribute('aria-expanded','false');});});}})();</script>'''
          if 'nav-toggle' in s and 'aria-expanded' not in s.split('</body>')[0].split('<script>')[-1]:
              s = s.replace('</body>', script + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate 1200x630 Open Graph preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H = 1200,630
          img = Image.new('RGB',(W,H),'#0B0F17')
          d = ImageDraw.Draw(img)
          for x in range(0,W,80): d.line((x,0,x,H),fill='#111b2b',width=1)
          for y in range(0,H,80): d.line((0,y,W,y),fill='#111b2b',width=1)
          d.rounded_rectangle((55,55,1145,575),radius=28,outline='#334155',width=2)
          d.rectangle((55,55,63,575),fill='#38BDF8')
          try:
              bold = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',64)
              role = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',30)
              small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',22)
              tag = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',20)
          except:
              bold=role=small=tag=None
          d.text((105,120),'RAUNIT SINGH',font=bold,fill='#F8FAFC')
          d.text((108,205),'Backend AI Engineer & Systems Developer',font=role,fill='#38BDF8')
          d.text((108,270),'AI  •  Systems  •  Cybersecurity  •  NLP',font=small,fill='#CBD5E1')
          d.line((108,325,720,325),fill='#334155',width=2)
          d.text((108,360),'Practical engineering across AI, backend systems,',font=small,fill='#9AA9BD')
          d.text((108,395),'edge networking and Linux security.',font=small,fill='#9AA9BD')
          for i,t in enumerate(['VOICEOPS AI','AEGISMESH','eBPF-AIMES']):
              x=108+i*270
              d.rounded_rectangle((x,475,x+240,525),radius=10,fill='#161F30',outline='#334155')
              d.text((x+18,489),t,font=tag,fill='#F8FAFC')
          d.text((900,545),'Ranchi, Jharkhand • India',font=small,fill='#7DD3FC')
          img.save('og-preview.png',quality=95)
          PY

      - name: Generate standard resume PDF
        run: |
          python - <<'PY'
          from reportlab.lib.pagesizes import A4
          from reportlab.lib import colors
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_LEFT
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, KeepTogether
          from reportlab.lib.units import mm

          out='Raunit_Singh_Resume.pdf'
          doc=SimpleDocTemplate(out,pagesize=A4,rightMargin=14*mm,leftMargin=14*mm,topMargin=12*mm,bottomMargin=12*mm)
          styles=getSampleStyleSheet()
          title=ParagraphStyle('Title2',parent=styles['Title'],fontName='Helvetica-Bold',fontSize=22,leading=25,textColor=colors.HexColor('#0B0F17'),spaceAfter=3)
          role=ParagraphStyle('Role',parent=styles['Normal'],fontName='Helvetica-Bold',fontSize=10.5,leading=13,textColor=colors.HexColor('#0369A1'),spaceAfter=4)
          body=ParagraphStyle('Body2',parent=styles['BodyText'],fontSize=8.6,leading=11,textColor=colors.HexColor('#334155'),spaceAfter=2)
          head=ParagraphStyle('Head2',parent=styles['Heading2'],fontName='Helvetica-Bold',fontSize=11,leading=13,textColor=colors.HexColor('#0369A1'),spaceBefore=6,spaceAfter=4)
          item=ParagraphStyle('Item',parent=body,leftIndent=8,firstLineIndent=-5,bulletIndent=0,spaceAfter=1)
          small=ParagraphStyle('Small',parent=body,fontSize=7.8,leading=10)
          story=[]
          story += [Paragraph('Raunit Singh',title),Paragraph('Backend AI Engineer & Systems Developer',role),Paragraph('Ranchi, Jharkhand, India • Usha Martin University',body),Paragraph('Email: baburajasingh7484@gmail.com • GitHub: github.com/singhraunit2807 • LinkedIn: linkedin.com/in/raunit-singh-39849a2b5 • X: x.com/parmarraunit287',small)]
          story += [Paragraph('PROFILE',head),Paragraph('Computer Science & Engineering undergraduate building practical systems across AI, ML, NLP, backend engineering, distributed systems, edge telemetry and cybersecurity.',body)]
          story += [Paragraph('EXPERIENCE & ACHIEVEMENTS',head)]
          exp=[('FlyRank AI — AI Intern','July 2026 – Present • Bosnia and Herzegovina','Specialization: General AI Fluency & Backend AI Engineering. AI-related implementation, experimentation and documentation using Python and NLP concepts.'),('Start-Up Pitch Competition — AegisMesh Project Pitch','Team NEXAEGIS — Finalist • Usha Martin University Ranchi • Aug 2026','Presented AegisMesh, a zero-bandwidth emergency communication system using ESP32, LoRa multi-hop networking and GPS telemetry; presented architecture, workflow and emergency use cases.'),('MSME Idea Hackathon 6.0 — Project Pitch','Team RapiFy • Jharkhand Tool Room, Ranchi','Presented VoiceOps AI and contributed to project concept, technical workflow, real-world applications, teamwork and pitching.'),('IBM — Summer Intern','May 2022 – June 2022 • New Delhi','Summer internship experience.')]
          for a,b,c in exp: story += [Paragraph(f'<b>{a}</b> — {b}',body),Paragraph(c,body)]
          story += [Paragraph('SELECTED PROJECTS',head)]
          projs=[('VoiceOps AI','Voice-driven scheduling backend using Twilio, Groq Whisper, Groq LLaMA, FastAPI, Supabase PostgreSQL, booking/rescheduling and conflict handling.'),('AegisMesh','Edge-native emergency communication system using ESP32, LoRa multi-hop routing and GPS telemetry for resilient coordination without conventional connectivity.'),('Image Relevance & Semantic Tagging Backend Service','FastAPI backend with semantic relevance scoring, LLM-generated tags, Pydantic validation, JWT authentication, PostgreSQL/SQLite, TTL caching, Docker, Pytest and GitHub Actions.'),('eBPF-AIMES','AI-assisted Linux runtime-security architecture connecting eBPF telemetry with behavioral analytics, risk scoring and controlled defensive response.')]
          for a,b in projs: story += [Paragraph(f'<b>{a}</b>',body),Paragraph(b,body)]
          story += [Paragraph('EDUCATION',head),Paragraph('<b>Usha Martin University, Ranchi</b> — B.Tech, Computer Science & Engineering — 2023 – Present',body),Paragraph('<b>MAHAVIR COLLEGE, GAYA</b> — Intermediate',body),Paragraph('<b>MINEHAHA HF EDUCATIONAL CENTRE, GAYA</b> — Matriculation',body)]
          story += [Paragraph('TECHNICAL SKILLS',head),Paragraph('<b>Languages:</b> Python, C++, SQL<br/><b>Backend & AI:</b> FastAPI, REST APIs, LLMs, NLP, Whisper, Pydantic, SQLAlchemy, JWT<br/><b>Systems & Security:</b> Linux, eBPF, ESP32, LoRa<br/><b>Infrastructure & Testing:</b> PostgreSQL, SQLite, Docker, GitHub Actions, Pytest',body)]
          story += [Paragraph('CERTIFICATIONS',head),Paragraph('28 certifications across Cisco, Anthropic and Unstop, including Ethical Hacker, Introduction to Cybersecurity, Python Essentials 1, AI Fluency for Builders, Claude Platform 101, Model Context Protocol topics, Ethical Hacking with AI and Cybersecurity Mastery.',body)]
          doc.build(story)
          PY

      - name: Persist generated portfolio assets
        run: |
          git config user.name 'Raunit Singh'
          git config user.email 'baburajasingh7484@gmail.com'
          git add index.html og-preview.png Raunit_Singh_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize portfolio SEO mobile navigation and resume assets'
            git push origin main
          fi
