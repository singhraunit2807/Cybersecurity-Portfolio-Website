name: Update Start-Up Pitch Entry

on:
  push:
    branches: [main]

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Update Start-Up Pitch Entry') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="card"><h3>Start-Up Pitch Competition — Certificate of Participation</h3><p>Usha Martin University Ranchi • Aug 2026</p></div>'
          new = '<div class="card"><h3>Start-Up Pitch Competition — AegisMesh Project Pitch</h3><p>Team NEXAEGIS — Finalist • Usha Martin University Ranchi • Aug 2026</p><p>Presented <strong>AegisMesh</strong>, a zero-bandwidth emergency communication system using ESP32, LoRa multi-hop networking and GPS telemetry to support communication when conventional connectivity is unavailable.</p><p>As part of <strong>Team NEXAEGIS</strong>, presented the system architecture, communication workflow and real-world emergency use cases, focusing on resilient, decentralized communication for disaster scenarios.</p></div>'
          if old not in s:
              raise SystemExit('Target Start-Up Pitch card not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update Start-Up Pitch Entry'
          git push
