name: Add certifications navigation link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Certifications nav link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#education">Education</a><a href="#contact">Contact</a>'
          new = '<a href="#education">Education</a><a href="#certifications">Licenses &amp; Certifications</a><a href="#contact">Contact</a>'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected navigation pattern not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Licenses and Certifications nav link"
          git push
