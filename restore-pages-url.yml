name: Restore GitHub Pages URL
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore default Pages URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://raunitlabs.dev/', 'https://singhraunit2807.github.io/Cybersecurity-Portfolio-Website/')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f CNAME
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CNAME
          git rm --cached CNAME 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Restore default GitHub Pages URL' && git push origin main; fi
